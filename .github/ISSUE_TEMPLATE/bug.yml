name: Сообщить об ошибке
description: Опишите проблему, чтобы её можно было воспроизвести и исправить.
title: "[Ошибка] "
labels:
  - ошибка
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Не публикуйте API-ключи, пароли и персональные данные.
  - type: input
    id: version
    attributes:
      label: Версия СметаОбъект
      description: Указана в окне «О программе» или в разделе журнала.
      placeholder: 0.3.35
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Что произошло
      description: Опишите фактический результат и сообщения на экране.
      placeholder: Подробное описание проблемы
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Перечислите действия по порядку.
      placeholder: |
        1. Открыть...
        2. Нажать...
        3. Увидеть...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      placeholder: Что должно было произойти
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Технические сведения
      description: Вставьте безопасную диагностику из раздела «Журнал и обратная связь».
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка данных
      options:
        - label: Я проверил текст и удалил секреты и персональные данные.
          required: true