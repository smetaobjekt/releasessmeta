name: Предложить улучшение
description: Опишите полезный сценарий или изменение интерфейса.
title: "[Пожелание] "
labels:
  - пожелание
body:
  - type: markdown
    attributes:
      value: |
        Чем конкретнее рабочий сценарий, тем проще оценить и реализовать улучшение.
  - type: input
    id: subject
    attributes:
      label: Краткая суть
      placeholder: Какую задачу должно упростить изменение
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Что предлагается
      description: Опишите изменение и пользу для пользователя.
      placeholder: Подробное описание идеи
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Рабочий сценарий
      description: Где и как это будет использоваться.
      placeholder: Пользователь открывает... затем...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Ожидаемый результат
      placeholder: Что станет быстрее, понятнее или надёжнее
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка данных
      options:
        - label: Я проверил текст и не добавил секреты и персональные данные.
          required: true